name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: signal_flow_component/package-lock.json
      - name: Install verified Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install canvas dependencies
        working-directory: signal_flow_component
        run: npm ci
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Check business logic, build canvas and run browser regression
        run: python scripts/dev.py check --frontend --ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
